name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Seed word bank
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run seed

      - name: Build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: Deploy to Firebase (hosting + Firestore rules)
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 -c "import os; open('/tmp/gcp-sa.json','w').write(os.environ['SA_JSON'])"
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa.json \
            ./node_modules/.bin/firebase deploy \
              --only hosting,firestore \
              --project gen-lang-client-0840619712 \
              --non-interactive
          rm /tmp/gcp-sa.json
